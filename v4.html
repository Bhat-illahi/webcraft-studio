<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>V4 MASTER DESIGNER – WebCraft Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  :root { --admin-primary: #6C63FF; --admin-bg: #050510; --admin-surface: #0d0d1a; --admin-border: rgba(255,255,255,0.1); }
  body { background: var(--admin-bg); min-height: 100vh; color: #fff; padding: 20px; font-family: 'Inter', sans-serif; }
  .admin-container { max-width: 1100px; margin: 0 auto; }
  
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--admin-primary); padding-bottom: 20px; }
  .v4-badge { background: #6C63FF; color: white; padding: 4px 12px; border-radius: 5px; font-size: 0.8rem; font-weight: 700; margin-left: 10px; box-shadow: 0 0 15px rgba(108,99,255,0.4); }
  
  .status-badge { font-size: 0.75rem; padding: 6px 15px; border-radius: 50px; background: rgba(255,255,255,0.05); display: flex; align-items: center; gap: 8px; margin-top: 5px; border: 1px solid rgba(255,255,255,0.1); }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
  .status-dot.online { background: #51CF66; box-shadow: 0 0 10px #51CF66; }
  
  .editor-section { margin-bottom: 50px; }
  .section-title { font-size: 1.1rem; color: var(--admin-primary); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--admin-border); padding-bottom: 10px; font-weight: 700; }
  
  .editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .editor-card { background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: 16px; padding: 24px; position: relative; }
  
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group textarea { width: 100%; background: #050510; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; font-size: 0.9rem; transition: border 0.3s; }
  
  .save-btn { width: 100%; padding: 15px; background: var(--admin-primary); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem; transition: 0.3s; }
  .save-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(108,99,255,0.3); }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .design-group { display: none; }
  .design-group.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .btn-outline { background: none; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
  .btn-outline:hover { background: var(--admin-primary); border-color: var(--admin-primary); }

  /* LOGIN GATE */
  #login-gate { position: fixed; inset: 0; background: #050510; z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .login-card { background: rgba(255,255,255,0.03); padding: 50px; border-radius: 20px; text-align: center; border: 1px solid var(--admin-primary); width: 100%; max-width: 400px; }
  .login-card input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; text-align: center; font-size: 1.2rem; }
  
  .hidden { display: none !important; }
</style>
</head>
<body>

  <div id="login-gate">
      <div class="login-card">
          <i class="fas fa-lock" style="font-size: 3rem; color: var(--admin-primary); margin-bottom: 20px;"></i>
          <h2>Master Access</h2>
          <input type="password" id="admin-pass" placeholder="Enter Password" onkeydown="if(event.key==='Enter') verifyAdmin()">
          <button class="save-btn" onclick="verifyAdmin()">Unlock Designer</button>
      </div>
  </div>

  <div id="admin-content" class="hidden">
    <div class="admin-container">
      <header class="admin-header">
        <div>
          <h1 style="font-family:'Space Grotesk'"><i class="fas fa-magic"></i> Master Designer <span class="v4-badge">V4 MASTER SYNC</span></h1>
          <div class="status-badge" id="dbStatus">
            <div class="status-dot"></div>
            <span>Cloud Connecting...</span>
          </div>
        </div>
        <a href="index.html" class="btn-outline" style="text-decoration:none;"><i class="fas fa-eye"></i> View Live Site</a>
      </header>

      <div class="editor-grid">
        <div class="editor-card" style="grid-column: 1 / -1;">
          <!-- PREVIEW BOX -->
          <div style="margin-bottom: 25px; border: 2px dashed var(--admin-primary); border-radius: 20px; padding: 60px; background: url('https://w.wallhaven.cc/full/1p/wallhaven-1p398v.jpg'); background-size: cover; text-align: center;">
            <div id="preview-wrap">
              <div id="note-preview" style="margin: 0 auto; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: nowrap; border: 1px solid rgba(255,255,255,0.1); padding: 25px;">
                  <div style="font-size: 2.5rem; display: flex; align-items: center;">
                      <i id="preview-icon" class="fas fa-exclamation-circle" style="color: #6C63FF;"></i>
                  </div>
                  <div style="text-align: left;">
                      <p style="margin:0;"><b id="preview-prefix" style="font-size: 1.2rem;">Important Note:</b></p>
                      <p id="preview-msg" style="margin:0; font-size: 1rem;">These are sample demo websites & are not functional.</p>
                  </div>
              </div>
            </div>
          </div>

          <!-- TABS -->
          <div style="display: flex; gap: 10px; margin-bottom: 20px;">
              <button class="btn-outline" onclick="showPanel('icon')">Icon</button>
              <button class="btn-outline" onclick="showPanel('text')">Text</button>
              <button class="btn-outline" onclick="showPanel('box')">Box Style</button>
              <button class="btn-outline" style="margin-left:auto; border-color: #FF6B6B; color:#FF6B6B;" onclick="location.reload()"><i class="fas fa-sync"></i> Refresh Page</button>
          </div>

          <!-- PANELS -->
          <div style="background: rgba(0,0,0,0.3); padding: 30px; border-radius: 20px; border: 1px solid var(--admin-border);">
              
              <div id="panel-icon" class="design-group active">
                  <label>Icon Color & Size</label>
                  <div style="display:flex; gap:20px; align-items:center;">
                      <input type="color" id="set-note-accent" value="#6C63FF" oninput="updatePreview()">
                      <input type="range" id="set-note-icon-size" min="10" max="100" value="40" oninput="updatePreview()">
                  </div>
              </div>

              <div id="panel-text" class="design-group">
                  <label>Prefix Title</label>
                  <input type="text" id="set-note-prefix" value="Important Note:" oninput="updatePreview()">
                  <label style="margin-top:20px;">Main Message</label>
                  <textarea id="set-note" rows="3" oninput="updatePreview()">These are sample demo websites & are not functional.</textarea>
              </div>

              <div id="panel-box" class="design-group">
                  <!-- IMPORTANT: HIDDEN ALIGN STORAGE -->
                  <input type="hidden" id="set-note-align" value="center">
                  
                  <label>Box Design (Color, Blur, Height, Width)</label>
                  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:10px;">
                      <div><span style="font-size:0.7rem; color:#888;">Glass Color</span><input type="color" id="set-note-bg" value="#050510" oninput="updatePreview()"></div>
                      <div><span style="font-size:0.7rem; color:#888;">Glass Blur</span><input type="range" id="set-note-blur" min="0" max="40" value="20" oninput="updatePreview()"></div>
                      <div style="background:rgba(108,99,255,0.1); padding:10px; border-radius:10px;"><span style="font-size:0.8rem; color:#6C63FF; font-weight:700;">BOX HEIGHT</span><input type="range" id="set-note-padding" min="0" max="150" value="30" oninput="updatePreview()"></div>
                      <div><span style="font-size:0.7rem; color:#888;">Box Width</span><input type="range" id="set-note-width" min="300" max="1150" value="800" oninput="updatePreview()"></div>
                  </div>

                  <div style="display:flex; align-items:center; gap:15px; margin-top:30px; background:rgba(255,255,255,0.03); padding:15px; border-radius:15px;">
                      <button class="btn-outline sm" onclick="setAlign('left')">L</button>
                      <button class="btn-outline sm" onclick="setAlign('center')">C</button>
                      <button class="btn-outline sm" onclick="setAlign('right')">R</button>
                      
                      <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
                          <input type="checkbox" id="set-note-box" checked onchange="updatePreview()">
                          <label style="margin:0; font-weight:700;">ENABLE BOX BACKGROUND</label>
                      </div>
                  </div>
              </div>

              <button id="applyBtn" class="save-btn" style="margin-top:30px;" onclick="saveMasterDesign()"><i class="fas fa-cloud-upload-alt"></i> Apply Live Master Design</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://imuqwquuytcfuqbpaqoa.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdXF3cXV1eXRjZnVxYnBhcW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTQwNzcsImV4cCI6MjA5MTAzMDA3N30.J_E1pbC8nJKMsIMJE-IAnI_3lV47q6WX0HuSSWIhpd4';
    let _supabase = null;

    function verifyAdmin() {
      if (document.getElementById('admin-pass').value === 'mumin69') {
        sessionStorage.setItem('v4_auth', 'true');
        document.getElementById('login-gate').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        initV4();
      } else { alert("Wrong Password!"); }
    }

    if (sessionStorage.getItem('v4_auth') === 'true') {
        document.getElementById('login-gate').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        window.onload = initV4;
    }

    async function initV4() {
      try {
        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await _supabase.from('site_settings').select('*');
        if (error) throw error;
        
        data.forEach(s => {
          if (s.key === 'note_prefix') document.getElementById('set-note-prefix').value = s.value;
          if (s.key === 'demo_note') document.getElementById('set-note').value = s.value;
          if (s.key === 'note_accent') document.getElementById('set-note-accent').value = s.value;
          if (s.key === 'note_bg') document.getElementById('set-note-bg').value = s.value;
          if (s.key === 'note_blur') document.getElementById('set-note-blur').value = s.value;
          if (s.key === 'note_padding') document.getElementById('set-note-padding').value = s.value;
          if (s.key === 'note_width') document.getElementById('set-note-width').value = s.value;
          if (s.key === 'note_radius') document.getElementById('set-note-radius').value = s.value;
          if (s.key === 'note_align') document.getElementById('set-note-align').value = s.value;
          if (s.key === 'note_box') document.getElementById('set-note-box').checked = (s.value === 'YES');
        });

        document.querySelector('.status-dot').classList.add('online');
        document.querySelector('#dbStatus span').innerText = "V4 Cloud Connected";
        updatePreview();
      } catch (err) {
        console.error(err);
        document.querySelector('#dbStatus span').innerText = "Cloud Offline (Fallback Mode)";
      }
    }

    function showPanel(id) {
        document.querySelectorAll('.design-group').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + id).classList.add('active');
    }

    function setAlign(val) {
        document.getElementById('set-note-align').value = val;
        updatePreview();
    }

    function updatePreview() {
      try {
        const bg = document.getElementById('set-note-bg').value;
        const blur = document.getElementById('set-note-blur').value;
        const padding = document.getElementById('set-note-padding').value;
        const width = document.getElementById('set-note-width').value;
        const accent = document.getElementById('set-note-accent').value;
        const isBox = document.getElementById('set-note-box').checked;
        const align = document.getElementById('set-note-align').value;

        const preview = document.getElementById('note-preview');
        
        document.getElementById('preview-prefix').innerText = document.getElementById('set-note-prefix').value;
        document.getElementById('preview-msg').innerText = document.getElementById('set-note').value;
        document.getElementById('preview-icon').style.color = accent;
        
        preview.style.maxWidth = width + 'px';
        if (align === 'left') preview.style.margin = "0 auto 0 0";
        else if (align === 'right') preview.style.margin = "0 0 0 auto";
        else preview.style.margin = "0 auto";

        if (isBox) {
          preview.style.background = hexToRgba(bg, 0.45);
          preview.style.backdropFilter = `blur(${blur}px)`;
          preview.style.webkitBackdropFilter = `blur(${blur}px)`;
          preview.style.padding = `${padding}px 40px`;
          preview.style.border = '1px solid rgba(255,255,255,0.15)';
        } else {
          preview.style.background = 'none';
          preview.style.backdropFilter = 'none';
          preview.style.padding = '10px';
          preview.style.border = 'none';
        }
      } catch(e) { console.error("Preview Crash:", e); }
    }

    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    async function saveMasterDesign() {
      const btn = document.getElementById('applyBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Speed-Syncing V4 Master...';

      try {
        const updates = [
          { key: 'note_prefix', value: document.getElementById('set-note-prefix').value },
          { key: 'demo_note', value: document.getElementById('set-note').value },
          { key: 'note_accent', value: document.getElementById('set-note-accent').value },
          { key: 'note_bg', value: document.getElementById('set-note-bg').value },
          { key: 'note_blur', value: document.getElementById('set-note-blur').value },
          { key: 'note_padding', value: document.getElementById('set-note-padding').value },
          { key: 'note_width', value: document.getElementById('set-note-width').value },
          { key: 'note_radius', value: '15' }, 
          { key: 'note_align', value: document.getElementById('set-note-align').value },
          { key: 'note_box', value: document.getElementById('set-note-box').checked ? 'YES' : 'NO' }
        ];

        const { error } = await _supabase.from('site_settings').upsert(updates, { onConflict: 'key' });
        if (error) throw error;

        btn.innerHTML = '<i class="fas fa-check"></i> V4 SYNC PERFECT!';
        btn.style.background = '#51CF66';
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Apply Live Master Design';
          btn.style.background = '';
        }, 2000);
      } catch (err) {
        alert("Sync Error: " + err.message);
        btn.disabled = false;
        btn.innerHTML = 'Retry V4 Sync';
      }
    }
  </script>
</body>
</html>
