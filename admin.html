<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Toolbox – WebCraft Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="style.css"/>
<style>
  body { background: #050510; display: flex; align-items: flex-start; justify-content: center; padding-top: 50px; min-height: 100vh; }
  .admin-panel { background: var(--surface); border: 1px solid var(--primary); padding: 40px; border-radius: 20px; width: 100%; max-width: 600px; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }
  .admin-header { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  .admin-header h1 { font-size: 1.5rem; font-family: 'Space Grotesk'; }
  .tool-box { margin-bottom: 40px; }
  .tool-box h2 { font-size: 1rem; margin-bottom: 20px; color: var(--primary); }
  .input-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .back-btn { margin-top: 30px; display: inline-block; color: var(--text-muted); font-size: 0.9rem; }
  .back-btn:hover { color: #fff; text-decoration: underline; }
</style>
</head>
<body>

<div class="admin-panel">
  <div class="admin-header">
    <h1><i class="fas fa-user-shield"></i> Owner's Toolbox</h1>
    <p style="font-size: 0.9rem; color: var(--text-muted);">Quickly generate message templates for your clients.</p>
  </div>

  <div class="tool-box">
    <h2><i class="fas fa-check-circle"></i> Payment Confirmation Generator</h2>
    <div class="input-grid">
      <div class="form-group">
        <label>Customer Name</label>
        <input type="text" id="custName" placeholder="e.g. Aman Kumar"/>
      </div>
      <div class="form-group">
        <label>Customer Phone (with country code)</label>
        <input type="tel" id="custPhone" placeholder="e.g. 91XXXXXXXXXX"/>
      </div>
      <div class="form-group">
        <label>Amount Received</label>
        <input type="text" id="amount" placeholder="e.g. ₹3500"/>
      </div>
    </div>
    <div class="btn-group">
      <button onclick="sendConfirmation('payment')" class="btn btn-whatsapp">
        <i class="fab fa-whatsapp"></i> Send Payment Confirmation
      </button>
      <button onclick="sendConfirmation('welcome')" class="btn btn-primary">
        <i class="fab fa-whatsapp"></i> Send Welcome Message
      </button>
    </div>
  </div>

  <div class="tool-box">
    <h2><i class="fas fa-copy"></i> Quick Templates</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">Commonly used professional snippets:</p>
    <div class="btn-group">
      <button onclick="copyToClipboard('Meeting Link: meet.google.com/xyz-abc')" class="btn btn-outline sm">Meeting Link</button>
      <button onclick="copyToClipboard('Order Confirmed: Processing your design now.')" class="btn btn-outline sm">Order Confirmed</button>
    </div>
  </div>

  <a href="index.html" class="back-btn">← Back to Main Website</a>
</div>

<script>
function sendConfirmation(type) {
    const name = document.getElementById('custName').value.trim() || 'Client';
    const phone = document.getElementById('custPhone').value.trim();
    const amount = document.getElementById('amount').value.trim() || '';

    if (!phone) {
        alert("Please enter the customer phone number.");
        return;
    }

    let msg = "";
    if (type === 'payment') {
        msg = `✅ *PAYMENT CONFIRMED — WebCraft Studio*\n\nHi ${name},\n\nWe have successfully received your payment of *${amount}*. \n\nThank you for choosing WebCraft Studio! Your website project is now officially in progress. We'll share the first draft with you shortly.\n\nBest regards,\nWebCraft Team`;
    } else {
        msg = `👋 *WELCOME — WebCraft Studio*\n\nHi ${name},\n\nThank you for reaching out! We are excited to build your professional website. Let's discuss your requirements in detail here.\n\nBest regards,\nWebCraft Team`;
    }

    const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert("Copied: " + text);
    });
}
</script>

</body>
</html>
