<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft V5 • Visual Master Designer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --admin-bg: #050510;
            --admin-card: #0c0c1e;
            --admin-primary: #6C63FF;
            --admin-accent: #00f2fe;
            --admin-text: #ffffff;
            --admin-gray: #a0a0c0;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--admin-bg);
            color: var(--admin-text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top Unified Navigation */
        .admin-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(12, 12, 30, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(108, 99, 255, 0.2);
            z-index: 2000;
            display: none; /* Shown after auth */
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--admin-text);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            color: var(--admin-primary);
        }

        /* The Designer Canvas */
        #designer-canvas {
            width: 100%;
            height: 100vh;
            border: none;
            background: #fff;
            overflow-y: auto;
            display: none; /* Shown after auth */
            padding-top: 70px;
            box-sizing: border-box;
        }

        /* Login Gate */
        #login-gate {
            position: fixed;
            inset: 0;
            background: var(--admin-bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--admin-card);
            padding: 50px;
            border-radius: 25px;
            border: 1px solid var(--admin-primary);
            width: 350px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .login-card input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            margin: 20px 0;
            text-align: center;
            font-size: 1.2rem;
        }

        .btn-auth {
            background: var(--admin-primary);
            color: #fff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
        }

        /* Floating Toolbox */
        #magic-toolbox {
            position: fixed;
            bottom: 120px;
            right: 40px;
            background: rgba(12, 12, 30, 0.9);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--admin-primary);
            width: 300px;
            z-index: 3000;
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .tool-row {
            margin-bottom: 15px;
        }

        .tool-row label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--admin-gray);
        }

        /* Bottom Fixed Save Bar */
        .apply-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2500;
            display: none;
        }
    </style>
</head>
<body>

    <div id="login-gate">
        <div class="login-card">
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                <i class="fas fa-fingerprint fa-2x"></i>
                <span style="font-size: 1.8rem;">V5 Visual Designer</span>
            </div>
            <p style="color:var(--admin-gray)">Enter Master Key to Start Designing</p>
            <input type="password" id="masterKey" placeholder="••••••" onkeydown="if(event.key==='Enter') executeAuth()">
            <button class="btn-auth" onclick="executeAuth()">Unlock Designer</button>
        </div>
    </div>

    <div class="admin-nav" id="admin-nav">
        <div class="logo">
            <i class="fas fa-rocket"></i>
            <span>V5 Visual Master</span>
        </div>
        <div class="logo" style="font-size: 0.8rem; color: var(--admin-gray);">
            <i class="fas fa-circle" style="color: #00c853;"></i> Sync Active
        </div>
    </div>

    <div id="designer-canvas"></div>

    <div id="magic-toolbox">
        <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
            <b style="color:var(--admin-primary);">Designer Tools</b>
            <i class="fas fa-times" onclick="closeToolbox()" style="cursor:pointer"></i>
        </div>
        <div class="tool-row">
            <label>Manual Color</label>
            <input type="color" id="tool-color" oninput="applyVisualChange('color')">
        </div>
        <div class="tool-row">
            <label>Font Size (px)</label>
            <input type="range" id="tool-size" min="10" max="120" oninput="applyVisualChange('fontSize')">
        </div>
        <div class="tool-row">
            <label>Corner Radius (px)</label>
            <input type="range" id="tool-radius" min="0" max="100" oninput="applyVisualChange('borderRadius')">
        </div>
    </div>

    <div class="apply-bar" id="apply-bar">
        <button class="btn-auth" id="saveBtn" onclick="saveV5Changes()" style="padding: 15px 50px; background: linear-gradient(135deg, #6C63FF, #4e36f5); border-radius: 50px; box-shadow: 0 10px 40px rgba(108, 99, 255, 0.4);">
             Apply Visual Pulse
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = "https://imuqwquuytcfuqbpaqoa.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdXF3cXV1eXRjZnVxYnBhcW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTQwNzcsImV4cCI6MjA5MTAzMDA3N30.J_E1pbC8nJKMsIMJE-IAnI_3lV47q6WX0HuSSWIhpd4";
        let _supabase = null;
        let activeEl = null;
        let changes = new Map();

        function executeAuth() {
            const key = document.getElementById('masterKey').value;
            if (key === 'mumin69') {
                console.log("Access Granted.");
                document.getElementById('login-gate').style.display = 'none';
                document.getElementById('admin-nav').style.display = 'flex';
                document.getElementById('designer-canvas').style.display = 'block';
                document.getElementById('apply-bar').style.display = 'block';
                startV5Engine();
            } else {
                alert("Incorrect Master Key.");
            }
        }

        async function startV5Engine() {
            try {
                _supabase = window.supabase.createClient(SB_URL, SB_KEY);
                
                // Load index.html safely
                const res = await fetch('index.html');
                const html = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const canvas = document.getElementById('designer-canvas');
                
                canvas.innerHTML = doc.body.innerHTML;
                
                // Re-inject Styles for live mirror
                doc.querySelectorAll('style, link[rel="stylesheet"]').forEach(s => {
                    document.head.appendChild(s.cloneNode(true));
                });

                // Attach Listeners
                canvas.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    triggerToolbox(e.target);
                });
                
                console.log("V5 Total Restoration Online.");
            } catch (err) {
                console.error("V5 Engine Error:", err);
            }
        }

        function triggerToolbox(el) {
            activeEl = el;
            const toolbox = document.getElementById('magic-toolbox');
            toolbox.style.display = 'block';
            
            // Highlight
            const allElements = document.getElementById('designer-canvas').querySelectorAll('*');
            allElements.forEach(n => n.style.outline = "none");
            el.style.outline = "2px solid var(--admin-primary)";
            el.style.outlineOffset = "4px";

            // Allow Text Edit
            if (el.children.length === 0) {
                el.contentEditable = "true";
                el.focus();
            }
        }

        function applyVisualChange(type) {
            if (!activeEl) return;
            const val = document.getElementById('tool-' + type.replace('borderRadius', 'radius')).value;
            
            if (type === 'color') activeEl.style.setProperty('color', val, 'important');
            if (type === 'fontSize') activeEl.style.fontSize = val + 'px';
            if (type === 'borderRadius') activeEl.style.borderRadius = val + 'px';
            
            saveToMemory(activeEl);
        }

        function saveToMemory(el) {
            if (!el.id) el.id = 'v5_el_' + Math.random().toString(36).substr(2, 9);
            changes.set(el.id, {
                color: el.style.color,
                fontSize: el.style.fontSize,
                borderRadius: el.style.borderRadius,
                text: el.innerText
            });
        }

        async function saveV5Changes() {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mirroring Changes...';
            
            try {
                for (let [id, val] of changes) {
                    await _supabase.from('site_settings').upsert({
                        key: `v5_${id}`,
                        value: JSON.stringify(val)
                    }, { onConflict: 'key' });
                }
                
                btn.style.background = "#00c853";
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Visual Changes Applied!';
                setTimeout(() => {
                    btn.style.background = "";
                    btn.innerHTML = 'Apply Visual Pulse';
                }, 3000);
            } catch (err) {
                btn.innerText = "Sync Error!";
            }
        }

        function closeToolbox() {
            if (activeEl) {
                activeEl.contentEditable = "false";
                activeEl.style.outline = "none";
            }
            document.getElementById('magic-toolbox').style.display = 'none';
        }
    </script>
</body>
</html>
