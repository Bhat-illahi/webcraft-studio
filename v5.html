<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft V5 • High-Visible Visual Master</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --admin-bg: #000000;
            --admin-card: #0c0c1e;
            --admin-primary: #6C63FF;
            --admin-accent: #00f2fe;
            --admin-text: #ffffff;
            --admin-gray: #a0a0c0;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--admin-bg);
            color: var(--admin-text);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top Bar Unified */
        .admin-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(12, 12, 30, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(108, 99, 255, 0.2);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        #designer-canvas {
            width: 100%;
            height: 100vh;
            background: #000;
            overflow-y: auto;
            display: none;
            padding-top: 70px;
            box-sizing: border-box;
            color: #fff; /* Ensure text is white against black */
        }

        /* Login Gate */
        #login-gate {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #0c0c1e;
            padding: 50px;
            border-radius: 25px;
            border: 1px solid var(--admin-primary);
            width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(108, 99, 255, 0.2);
        }

        .login-card input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: #000;
            border: 1px solid var(--admin-primary);
            color: #fff;
            margin: 20px 0;
            text-align: center;
            font-size: 1.5rem;
            font-family: 'Space Grotesk';
        }

        /* Floating Studio Bar */
        #studio-toolbox {
            position: fixed;
            top: 100px;
            right: 40px;
            background: rgba(12, 12, 30, 0.95);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--admin-primary);
            width: 320px;
            z-index: 3000;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .tool-row {
            margin-bottom: 20px;
        }

        .tool-row label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--admin-gray);
        }

        input[type="color"] {
            border: none;
            background: none;
            width: 100%;
            height: 40px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--admin-primary);
        }

        /* Bottom Mirror Fix Bar */
        .apply-bar {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2500;
            display: none;
        }

        .btn-apply {
            background: linear-gradient(135deg, var(--admin-primary), #4e36f5);
            color: #fff;
            padding: 18px 60px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(108, 99, 255, 0.4);
            transition: 0.3s;
        }

        .btn-apply:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.6);
        }

        /* HIGHLIGHT PULSE */
        .editing-now {
            outline: 2px dashed var(--admin-primary) !important;
            outline-offset: 4px !important;
            transition: outline 0.2s ease !important;
        }
    </style>
</head>
<body>

    <div id="login-gate">
        <div class="login-card">
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                <i class="fas fa-fingerprint fa-2x"></i>
                <span style="font-size: 2rem;">V5 High-Visible Master</span>
            </div>
            <p style="color:var(--admin-gray)">Enter Master Key to Start Designing</p>
            <input type="password" id="masterKey" placeholder="••••••" onkeydown="if(event.key==='Enter') executeAuth()">
            <button class="btn-apply" onclick="executeAuth()" style="width:100%; padding: 15px;">Unlock High-Definition Pulse</button>
        </div>
    </div>

    <div class="admin-nav" id="admin-nav">
        <div class="logo">
            <i class="fas fa-rocket"></i>
            <span>Visual High-Definition Master</span>
        </div>
        <div class="logo" style="font-size: 0.8rem; color: #51CF66;">
            <i class="fas fa-circle"></i> High-Pulse Sync Active
        </div>
    </div>

    <div id="designer-canvas"></div>

    <div id="studio-toolbox">
        <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
            <b style="color:var(--admin-primary);">VISUAL TOOLS</b>
            <i class="fas fa-times" onclick="closeToolbox()" style="cursor:pointer"></i>
        </div>
        
        <div class="tool-row" id="color-tool">
            <label><i class="fas fa-palette"></i> Manual Color (Element/Word)</label>
            <input type="color" id="tool-color" oninput="applyHighPulse('color')">
        </div>
        
        <div class="tool-row" id="size-tool">
            <label><i class="fas fa-text-height"></i> Font Size (px)</label>
            <input type="range" id="tool-size" min="10" max="150" oninput="applyHighPulse('fontSize')">
        </div>
        
        <div class="tool-row">
            <label><i class="fas fa-arrows-alt-v"></i> Height / Padding (px)</label>
            <input type="range" id="tool-padding" min="0" max="400" oninput="applyHighPulse('padding')">
        </div>

        <div class="tool-row">
            <label><i class="fas fa-arrows-alt-h"></i> Content Width (%)</label>
            <input type="range" id="tool-width" min="10" max="100" oninput="applyHighPulse('width')">
        </div>

        <div class="tool-row">
            <label><i class="fas fa-border-all"></i> Corner Rounding (px)</label>
            <input type="range" id="tool-radius" min="0" max="150" oninput="applyHighPulse('borderRadius')">
        </div>
        
        <div style="background:rgba(108,99,255,0.1); padding:10px; border-radius:10px; font-size:0.75rem; color:var(--admin-gray);">
            <i class="fas fa-info-circle"></i> Double-click any word or sentence to modify its unique color and size manually!
        </div>
    </div>

    <div class="apply-bar" id="apply-bar">
        <button class="btn-apply" id="saveBtn" onclick="saveVisualPulse()">
             Apply Total Site Mirror ✅
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = "https://imuqwquuytcfuqbpaqoa.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdXF3cXV1eXRjZnVxYnBhcW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTQwNzcsImV4cCI6MjA5MTAzMDA3N30.J_E1pbC8nJKMsIMJE-IAnI_3lV47q6WX0HuSSWIhpd4";
        let _supabase = null;
        let activeEl = null;
        let pendingChanges = new Map();

        async function executeAuth() {
            const k = document.getElementById('masterKey').value;
            if (k === 'mumin69') {
                document.getElementById('login-gate').style.display = 'none';
                document.getElementById('admin-nav').style.display = 'flex';
                document.getElementById('designer-canvas').style.display = 'block';
                document.getElementById('apply-bar').style.display = 'block';
                
                // Initialize Supabase SDK
                _supabase = window.supabase.createClient(SB_URL, SB_KEY);
                
                initHighVisibleDesigner();
            } else {
                alert("Access Denied.");
            }
        }

        async function initHighVisibleDesigner() {
            try {
                const res = await fetch('index.html');
                let html = await res.text();
                
                // CLEANUP: Strip Particles/Magnetic/Backgrounds for speed and readability
                html = html.replace(/createParticles\(\);/g, "// Particles Disabled");
                html = html.replace(/<canvas[^>]*><\/canvas>/g, ""); // Remove particle canvases
                html = html.replace(/class="magnetic"/g, 'class=""'); // Disable magnetic lag
                
                const canvas = document.getElementById('designer-canvas');
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Ensure the background is deep black and text is visible
                doc.body.style.background = "#000";
                
                canvas.innerHTML = doc.body.innerHTML;

                // Sync Styles
                doc.querySelectorAll('style, link[rel="stylesheet"]').forEach(s => {
                    document.head.appendChild(s.cloneNode(true));
                });

                // Attach Magic Double-Click listeners
                canvas.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    launchStudioTool(e.target);
                });
                
                console.log("High-Pulse Visual Master Active.");
            } catch (err) {
                console.error("V5 Load Error:", err);
            }
        }

        function launchStudioTool(el) {
            activeEl = el;
            const toolbox = document.getElementById('studio-toolbox');
            toolbox.style.display = 'block';
            
            // Visual Indicator
            document.getElementById('designer-canvas').querySelectorAll('.editing-now').forEach(n => n.classList.remove('editing-now'));
            el.classList.add('editing-now');

            // Text Pulse mode
            if (el.children.length === 0) {
                el.contentEditable = "true";
                el.focus();
            }
            
            // Set slider values
            document.getElementById('tool-color').value = rgbToHex(getComputedStyle(el).color);
            document.getElementById('tool-size').value = parseInt(getComputedStyle(el).fontSize);
        }

        function applyHighPulse(type) {
            if (!activeEl) return;
            const val = document.getElementById('tool-' + type.replace('borderRadius', 'radius')).value;
            
            if (type === 'color') activeEl.style.setProperty('color', val, 'important');
            if (type === 'fontSize') activeEl.style.fontSize = val + 'px';
            if (type === 'padding') activeEl.style.padding = val + 'px';
            if (type === 'width') activeEl.style.width = val + '%';
            if (type === 'borderRadius') activeEl.style.borderRadius = val + 'px';
            
            // Track Change for Sync
            if (!activeEl.id) activeEl.id = 'pulse_el_' + Math.random().toString(36).substr(2, 9);
            pendingChanges.set(activeEl.id, {
                color: activeEl.style.color,
                fontSize: activeEl.style.fontSize,
                padding: activeEl.style.padding,
                width: activeEl.style.width,
                borderRadius: activeEl.style.borderRadius,
                text: activeEl.innerText
            });
        }

        async function saveVisualPulse() {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Synchronizing Pulse...';
            
            try {
                for (let [id, val] of pendingChanges) {
                    await _supabase.from('site_settings').upsert({
                        key: `v5_${id}`,
                        value: JSON.stringify(val)
                    }, { onConflict: 'key' });
                }

                btn.style.background = "#00c853";
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Pulse Mirror Active on Live Site!';
                setTimeout(() => {
                    btn.style.background = "";
                    btn.innerHTML = 'Apply Total Site Mirror ✅';
                }, 3000);
            } catch (err) {
                btn.innerText = "Cloud Error!";
            }
        }

        function closeToolbox() {
            if (activeEl) {
                activeEl.contentEditable = "false";
                activeEl.classList.remove('editing-now');
            }
            document.getElementById('studio-toolbox').style.display = 'none';
        }

        function rgbToHex(rgb) {
            const result = rgb.match(/\d+/g);
            return result ? "#" + result.map(x => parseInt(x).toString(16).padStart(2, '0')).join('') : "#ffffff";
        }
    </script>
</body>
</html>
