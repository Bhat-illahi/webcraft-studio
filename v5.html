<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft V5 • Visual Master Designer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --admin-bg: #050510;
            --admin-card: #0c0c1e;
            --admin-primary: #6C63FF;
            --admin-accent: #00f2fe;
            --admin-text: #ffffff;
            --admin-gray: #a0a0c0;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--admin-bg);
            color: var(--admin-text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* Top Unified Navigation */
        .admin-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(12, 12, 30, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(108, 99, 255, 0.2);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--admin-text);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            color: var(--admin-primary);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 12px;
        }

        .nav-tab {
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--admin-gray);
        }

        .nav-tab.active {
            background: var(--admin-primary);
            color: #fff;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
        }

        /* The Designer Canvas */
        #designer-canvas {
            margin-top: 70px;
            width: 100%;
            height: calc(100vh - 70px);
            border: none;
            background: #fff;
            transform-origin: top center;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        /* Magic Floating Toolbox */
        #magic-toolbox {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(12, 12, 30, 0.9);
            backdrop-filter: blur(30px);
            border: 1px solid var(--admin-primary);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 20px;
            z-index: 3000;
            display: none;
            opacity: 0;
            transition: all 0.3s ease;
            width: 350px;
        }

        #magic-toolbox.active {
            display: block;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toolbox-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .toolbox-header h4 {
            margin: 0;
            font-size: 1rem;
            color: var(--admin-primary);
        }

        .tool-row {
            margin-bottom: 15px;
        }

        .tool-row label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: var(--admin-gray);
        }

        .tool-row input[type="range"] {
            width: 100%;
        }

        .tool-row input[type="color"] {
            width: 50px;
            height: 30px;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Apply Button */
        .apply-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2500;
        }

        .btn-apply {
            background: linear-gradient(135deg, var(--admin-primary), #4e36f5);
            color: #fff;
            border: none;
            padding: 15px 45px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(108, 99, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-apply:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.6);
        }

        /* Designer Interaction Overlays */
        .edit-overlay {
            position: absolute;
            pointer-events: none;
            border: 2px dashed var(--admin-primary);
            display: none;
            z-index: 1500;
        }

        /* Dark Mode Inputs for Form Tabs */
        input, textarea, select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(108, 99, 255, 0.2);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--admin-bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--admin-card);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(108, 99, 255, 0.2);
            width: 350px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Access Control Pulse -->
    <div id="login-overlay">
        <div class="login-card">
            <div class="logo" style="justify-content: center; margin-bottom: 30px;">
                <i class="fas fa-fingerprint fa-2x"></i>
                <span style="font-size: 2rem;">V5 Visual Master</span>
            </div>
            <input type="password" id="adminPassword" placeholder="Master Admin Password" style="text-align: center;">
            <button onclick="checkAccess()" class="btn-apply" style="width: 100%; justify-content: center;">Authenticate Designer</button>
        </div>
    </div>

    <!-- Main Navigation Pulse -->
    <div class="admin-nav">
        <div class="logo">
            <i class="fas fa-rocket"></i>
            <span>V5 Visual Master</span>
        </div>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchMode('visual')"><i class="fas fa-magic"></i> Live Visual</div>
            <div class="nav-tab" onclick="switchMode('services')"><i class="fas fa-server"></i> Services</div>
            <div class="nav-tab" onclick="switchMode('pricing')"><i class="fas fa-tags"></i> Pricing</div>
        </div>
        <div style="width: 150px;"></div>
    </div>

    <!-- Designer Interaction Canvas -->
    <div id="designer-canvas"></div>

    <!-- Magic Floating Toolbox -->
    <div id="magic-toolbox">
        <div class="toolbox-header">
            <h4><i class="fas fa-brush"></i> Element Settings</h4>
            <i class="fas fa-times" onclick="closeToolbox()" style="cursor:pointer;"></i>
        </div>
        <div class="tool-row">
            <label>Text Color</label>
            <input type="color" id="tool-color" oninput="applyMagicChange('color')">
        </div>
        <div class="tool-row">
            <label>Font Size</label>
            <input type="range" id="tool-size" min="10" max="100" oninput="applyMagicChange('fontSize')">
        </div>
        <div class="tool-row">
            <label>Height (Padding)</label>
            <input type="range" id="tool-height" min="0" max="300" oninput="applyMagicChange('padding')">
        </div>
        <div class="tool-row">
            <label>Corner Rounding</label>
            <input type="range" id="tool-radius" min="0" max="100" oninput="applyMagicChange('borderRadius')">
        </div>
        <div class="tool-row">
            <label>Width (%)</label>
            <input type="range" id="tool-width" min="10" max="100" oninput="applyMagicChange('width')">
        </div>
    </div>

    <!-- Master Apply Pulse -->
    <div class="apply-bar">
        <button class="btn-apply" onclick="saveVisualMaster()" id="saveBtn">
            <i class="fas fa-cloud-upload-alt"></i> Apply Visual Master Design
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = "https://imuqwquuytcfuqbpaqoa.supabase.co";
        const SB_KEY = ""; // USER MUST PROVIDE KEY OR IT WILL BE GATHERED FROM APP.JS
        let supabase = null;
        let activeEl = null;
        let originalContent = "";
        let pendingChanges = new Map();

        async function initDesigner() {
            // Fetch index.html content
            const response = await fetch('index.html');
            const html = await response.text();
            const canvas = document.getElementById('designer-canvas');
            
            // Clean up scripts from the fetched HTML to prevent loops
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // Re-inject HTML into canvas
            canvas.innerHTML = doc.body.innerHTML;
            
            // Inject styles from doc to current page for live preview
            const styles = doc.querySelectorAll('style, link[rel="stylesheet"]');
            styles.forEach(s => document.head.appendChild(s.cloneNode(true)));

            // Add Magic Double-Click Listeners
            canvas.addEventListener('dblclick', (e) => {
                e.preventDefault();
                openMagicToolbox(e.target);
            });
            
            console.log("Visual Master Canvas Loaded.");
        }

        function openMagicToolbox(el) {
            activeEl = el;
            const toolbox = document.getElementById('magic-toolbox');
            toolbox.classList.add('active');
            
            // Set values based on active element
            document.getElementById('tool-color').value = rgbToHex(getComputedStyle(el).color);
            document.getElementById('tool-size').value = parseInt(getComputedStyle(el).fontSize);
            
            // Enable text editing if it's text
            if (el.children.length === 0) {
                el.contentEditable = "true";
                el.focus();
            }
            
            // Force Red Indicator for active element
            canvas.querySelectorAll('*').forEach(n => n.style.outline = "none");
            el.style.outline = "2px solid var(--admin-primary)";
        }

        function applyMagicChange(prop) {
            if (!activeEl) return;
            const val = document.getElementById('tool-' + prop.toLowerCase()).value;
            
            if (prop === 'color') activeEl.style.setProperty('color', val, 'important');
            if (prop === 'fontSize') activeEl.style.fontSize = val + 'px';
            if (prop === 'padding') activeEl.style.padding = val + 'px';
            if (prop === 'borderRadius') activeEl.style.borderRadius = val + 'px';
            if (prop === 'width') activeEl.style.width = val + '%';
            
            // Record change for save
            const id = activeEl.id || 'el-' + Math.random().toString(36).substr(2, 9);
            if (!activeEl.id) activeEl.id = id;
            
            pendingChanges.set(id, {
                color: activeEl.style.color,
                fontSize: activeEl.style.fontSize,
                padding: activeEl.style.padding,
                borderRadius: activeEl.style.borderRadius,
                width: activeEl.style.width,
                text: activeEl.innerText
            });
        }

        function closeToolbox() {
            if (activeEl) {
                activeEl.contentEditable = "false";
                activeEl.style.outline = "none";
            }
            document.getElementById('magic-toolbox').classList.remove('active');
        }

        async function saveVisualMaster() {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading Visual Pulse...';
            
            // Upsert all pending changes to Supabase
            // This maps Visual Changes to Site Settings table
            try {
                for (let [id, val] of pendingChanges) {
                    await supabase.from('site_settings').upsert({
                        key: `v5_${id}`,
                        value: JSON.stringify(val)
                    }, { onConflict: 'key' });
                }

                btn.style.background = "#00c853";
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Visual Pulse Applied Successfully!';
                setTimeout(() => {
                    btn.style.background = "";
                    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Apply Visual Master Design';
                }, 3000);
            } catch (err) {
                btn.style.background = "#ff1744";
                btn.innerText = "Error during Upload!";
            }
        }

        function rgbToHex(rgb) {
            const result = rgb.match(/\d+/g);
            return result ? "#" + result.map(x => parseInt(x).toString(16).padStart(2, '0')).join('') : "#ffffff";
        }

        function switchMode(mode) {
            console.log("Switching to", mode);
            // In V5, we can show/hide sections or redirect to the legacy tabs
            if (mode !== 'visual') {
                alert("Opening " + mode + " panel...");
            }
        }

        async function checkAccess() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === 'mumin69') {
                document.getElementById('login-overlay').style.display = 'none';
                // Initialize Supabase (Key normally taken from app.js but hardcoded temporarily for dev)
                // In production, we'll fetch it from the repo.
                initDesigner();
            } else {
                alert("Access Denied.");
            }
        }
    </script>
</body>
</html>
