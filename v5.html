<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft V5 • Iframe Master Designer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --admin-bg: #000000;
            --admin-card: #0c0c1e;
            --admin-primary: #6C63FF;
            --admin-text: #ffffff;
            --admin-gray: #a0a0c0;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--admin-bg);
            color: var(--admin-text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top Nav & Tabs */
        .admin-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: rgba(12, 12, 30, 0.95);
            backdrop-filter: blur(25px);
            border-bottom: 2px solid rgba(108, 99, 255, 0.3);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .btn-live {
            background: rgba(108, 99, 255, 0.1);
            border: 1px solid rgba(108, 99, 255, 0.4);
            color: #fff;
            padding: 10px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .btn-live:hover {
            background: var(--admin-primary);
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.4);
            transform: translateY(-2px);
        }

        .panel { display: none; padding-top: 75px; width: 100%; height: 100vh; }
        .panel.active { display: block; }

        /* The Isolated Iframe Canvas */
        #site-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        /* Login Gate */
        #login-gate {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #0c0c1e;
            padding: 60px;
            border-radius: 30px;
            border: 1px solid var(--admin-primary);
            width: 420px;
            text-align: center;
        }

        .login-card input {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            background: #000;
            border: 2px solid var(--admin-primary);
            color: #fff;
            margin: 25px 0;
            text-align: center;
            font-size: 1.6rem;
            font-family: 'Space Grotesk';
        }

        /* Floating Studio Bar */
        #studio-toolbox {
            position: fixed;
            top: 100px;
            right: 40px;
            background: rgba(12, 12, 30, 0.9);
            backdrop-filter: blur(25px);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--admin-primary);
            width: 320px;
            z-index: 3000;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .btn-apply {
            background: linear-gradient(135deg, var(--admin-primary), #4e36f5);
            color: #fff;
            padding: 18px 60px;
            border-radius: 100px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(108, 99, 255, 0.4);
            transition: 0.3s;
        }

        /* Forms Layout */
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: #0c0c1e;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div id="login-gate">
        <div class="login-card">
            <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom: 30px;">
                <i class="fas fa-user-shield fa-3x" style="color:var(--admin-primary)"></i>
                <span style="font-size: 2rem; font-weight:800; font-family:'Space Grotesk';">WEBCRAFT STUDIO ADMIN</span>
            </div>
            <p style="color:var(--admin-gray)">Control your website design in real-time</p>
            <input type="password" id="masterKey" placeholder="Enter Password" onkeydown="if(event.key==='Enter') executeAuth()">
            <button class="btn-apply" onclick="executeAuth()" style="width:100%; padding: 18px;">Login to Designer</button>
        </div>
    </div>

    <div class="admin-nav" id="admin-nav">
        <div class="logo">
            <i class="fas fa-paint-brush" style="color:var(--admin-primary)"></i>
            <span style="font-weight:800; font-family:'Space Grotesk'; font-size:1.4rem; color:#fff;">Visual Master Designer</span>
        </div>
        <a href="https://chipper-klepon-836e8c.netlify.app/" target="_blank" class="btn-live">
            <i class="fas fa-external-link-alt"></i> View Live Site
        </a>
    </div>

    <!-- PANEL: VISUAL (IFRAME) -->
    <div id="panel-visual" class="panel active">
        <iframe id="site-frame" name="site-frame"></iframe>

        <div id="studio-toolbox">
            <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                <b style="color:var(--admin-primary); text-transform:uppercase; font-size:0.8rem;">Design Editor</b>
                <i class="fas fa-times" onclick="closeToolbox()" style="cursor:pointer"></i>
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Target Mode</label>
                <div style="display:flex; gap:10px;">
                    <button class="tab-btn active" id="mode-text" onclick="switchTargetMode('color')" style="padding:5px 15px; font-size:0.75rem;">Text</button>
                    <button class="tab-btn" id="mode-bg" onclick="switchTargetMode('backgroundColor')" style="padding:5px 15px; font-size:0.75rem;">Box/BG</button>
                    <button class="tab-btn" onclick="selectParent()" style="padding:5px 15px; font-size:0.75rem; background:rgba(255,255,255,0.1);"><i class="fas fa-level-up-alt"></i> Parent Box</button>
                </div>
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Choose Color</label>
                <input type="color" id="tool-color" oninput="applyPulse('color')" style="width:100%; height:40px; border:none; background:none; cursor:pointer;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Text Size (px)</label>
                <input type="range" id="tool-size" min="10" max="150" oninput="applyPulse('fontSize')" style="width:100%; accent-color:var(--admin-primary)">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Space / Height (px)</label>
                <input type="range" id="tool-padding" min="0" max="400" oninput="applyPulse('padding')" style="width:100%; accent-color:var(--admin-primary)">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Corner Rounding (px)</label>
                <input type="range" id="tool-radius" min="0" max="150" oninput="applyPulse('borderRadius')" style="width:100%; accent-color:var(--admin-primary)">
            </div>
            <button class="btn-apply" style="width:100%; padding:12px; font-size:1rem;" onclick="confirmElementPulse()">
                Apply Changes ✍️
            </button>
        </div>

        <div style="position:fixed; bottom:40px; left:50%; transform:translateX(-50%); z-index:2500;">
             <button class="btn-apply" id="saveBtn" onclick="saveV5Mirror()">Save & Update Live Site ✅</button>
        </div>
    </div>

    <!-- PANEL: SERVICES -->
    <div id="panel-services" class="panel">
        <div class="form-container">
            <h3 style="color:var(--admin-primary);">Портфолио (Service Cards)</h3>
            <div style="color:var(--admin-gray); font-size:0.8rem; margin-bottom:20px;">Edit your card details below:</div>
            <!-- Porting Legacy Services Editor logic here -->
             <button class="btn-apply" style="width:100%;">Update Services</button>
        </div>
    </div>

    <!-- PANEL: PRICING -->
    <div id="panel-pricing" class="panel">
        <div class="form-container">
            <h3 style="color:var(--admin-primary);">Pricing Packages</h3>
             <!-- Porting Legacy Pricing Editor logic here -->
             <button class="btn-apply" style="width:100%;">Update Plans</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = "https://imuqwquuytcfuqbpaqoa.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdXF3cXV1eXRjZnVxYnBhcW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTQwNzcsImV4cCI6MjA5MTAzMDA3N30.J_E1pbC8nJKMsIMJE-IAnI_3lV47q6WX0HuSSWIhpd4";
        let _supabase = null;
        let activeEl = null;
        let pendingChanges = new Map();

        function switchTab(t) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + t).classList.add('active');
            event.target.classList.add('active');
        }

        async function executeAuth() {
            if (document.getElementById('masterKey').value === 'mumin69') {
                document.getElementById('login-gate').style.display = 'none';
                document.getElementById('admin-nav').style.display = 'flex';
                _supabase = window.supabase.createClient(SB_URL, SB_KEY);
                startIframeStudio();
            } else { alert("Key Denied."); }
        }

        function startIframeStudio() {
            const frame = document.getElementById('site-frame');
            frame.src = "index.html?v=" + Date.now(); // Cache busting

            frame.addEventListener('load', () => {
                console.log("Iframe Loaded. Building Bridge...");
                const doc = frame.contentDocument || frame.contentWindow.document;
                
                // Inject an "Editor Highlighting" Style into the Iframe
                const style = doc.createElement('style');
                style.innerHTML = ".v5-editing { outline: 2px dashed #6C63FF !important; outline-offset: 4px !important; }";
                doc.head.appendChild(style);

                // Attach Double-Click listener to the Iframe
                doc.body.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    launchFrameStudio(e.target);
                });
            });
        }

        function launchFrameStudio(el) {
            activeEl = el;
            document.getElementById('studio-toolbox').style.display = 'block';
            
            // Highlight in Iframe
            const doc = document.getElementById('site-frame').contentDocument;
            doc.querySelectorAll('.v5-editing').forEach(n => n.classList.remove('v5-editing'));
            el.classList.add('v5-editing');

            // Allow Inline Edit
            if (el.children.length === 0) {
                el.contentEditable = "true";
                el.focus();
            }
        }

        let activeTargetMode = 'color';

        function switchTargetMode(mode) {
            activeTargetMode = mode;
            document.querySelectorAll('#mode-text, #mode-bg').forEach(b => b.classList.remove('active'));
            document.getElementById(mode === 'color' ? 'mode-text' : 'mode-bg').classList.add('active');
        }

        function selectParent() {
            if (!activeEl || !activeEl.parentElement) return;
            launchFrameStudio(activeEl.parentElement);
        }

        function applyPulse(type) {
            if (!activeEl) return;
            const val = document.getElementById('tool-' + (type==='borderRadius'?'radius':type)).value;
            
            // Apply with High Priority for REAL-TIME PREVIEW
            const property = (type === 'color') ? activeTargetMode : type;
            activeEl.style.setProperty(property, val, 'important');
            
            const trackingId = activeEl.id || ('v5_gen_' + Math.random().toString(36).substr(2, 6));
            if (!activeEl.id) activeEl.id = trackingId;
        }

        function confirmElementPulse() {
            if (!activeEl) return;
            
            const trackingId = activeEl.id;
            // Finalize values for this element
            pendingChanges.set(trackingId, {
                color: activeEl.style.color,
                background: activeEl.style.backgroundColor,
                fontSize: activeEl.style.fontSize,
                padding: activeEl.style.padding,
                borderRadius: activeEl.style.borderRadius,
                text: activeEl.innerText
            });

            // Visual feedback
            const btn = event.target;
            btn.style.background = "#00c853";
            btn.innerText = "Applied ✅";
            setTimeout(() => {
                btn.style.background = "";
                btn.innerText = "Apply Changes ✍️";
            }, 1000);
        }

        async function saveV5Mirror() {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mirroring Full site...';
            
            try {
                for (let [id, val] of pendingChanges) {
                    await _supabase.from('site_settings').upsert({
                        key: `v5_${id}`,
                        value: JSON.stringify(val)
                    }, { onConflict: 'key' });
                }

                btn.style.background = "#00c853";
                btn.innerHTML = '<i class="fas fa-check-circle"></i>site Mirror Active!';
                setTimeout(() => {
                    btn.style.background = "";
                    btn.innerHTML = 'Apply All Visual Changes ✅';
                }, 3000);
            } catch (err) { btn.innerText = "Sync Error!"; }
        }

        function closeToolbox() {
            if (activeEl) activeEl.classList.remove('v5-editing');
            document.getElementById('studio-toolbox').style.display = 'none';
        }
    </script>
</body>
</html>
