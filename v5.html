<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft V5 • Total Master Designer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --admin-bg: #000000;
            --admin-card: #0c0c1e;
            --admin-primary: #6C63FF;
            --admin-text: #ffffff;
            --admin-gray: #a0a0c0;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--admin-bg);
            color: var(--admin-text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top Nav & Tabs */
        .admin-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: rgba(12, 12, 30, 0.95);
            backdrop-filter: blur(25px);
            border-bottom: 2px solid rgba(108, 99, 255, 0.3);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .tab-group { display: flex; gap: 15px; }
        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(108, 99, 255, 0.2);
            color: var(--admin-gray);
            padding: 10px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--admin-primary);
            color: #fff;
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.4);
        }

        .panel { display: none; padding-top: 75px; width: 100%; height: 100vh; color: #fff; transition: 0.3s; }
        .panel.active { display: block; }

        /* The Visual Canvas */
        #designer-canvas {
            width: 100%;
            height: 100%;
            background: #000;
            overflow-y: auto;
            position: relative;
        }

        /* Login Mode */
        #login-gate {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #0c0c1e;
            padding: 60px;
            border-radius: 30px;
            border: 1px solid var(--admin-primary);
            width: 420px;
            text-align: center;
            box-shadow: 0 0 80px rgba(108, 99, 255, 0.2);
        }

        .login-card input {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            background: #000;
            border: 2px solid var(--admin-primary);
            color: #fff;
            margin: 25px 0;
            text-align: center;
            font-size: 1.6rem;
            font-family: 'Space Grotesk';
        }

        /* Forms Layout */
        .form-container {
            max-width: 1200px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .form-card {
            background: #0c0c1e;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--admin-gray); font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
        }

        /* Floating Studio Bar */
        #studio-toolbox {
            position: fixed;
            top: 100px;
            right: 40px;
            background: rgba(12, 12, 30, 0.95);
            backdrop-filter: blur(25px);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--admin-primary);
            width: 320px;
            z-index: 3000;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .btn-apply {
            background: linear-gradient(135deg, var(--admin-primary), #4e36f5);
            color: #fff;
            padding: 18px 60px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(108, 99, 255, 0.4);
        }

        /* HIGHLIGHT PULSE */
        .editing-now { outline: 2px dashed var(--admin-primary) !important; outline-offset: 4px !important; }
    </style>
</head>
<body>

    <div id="login-gate">
        <div class="login-card">
            <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom: 30px;">
                <i class="fas fa-fingerprint fa-3x" style="color:var(--admin-primary)"></i>
                <span style="font-size: 2.2rem; font-weight:800; font-family:'Space Grotesk';">V5 TOTAL MASTER</span>
            </div>
            <p style="color:var(--admin-gray)">Unlock Your Site's Deep Pulse</p>
            <input type="password" id="masterKey" placeholder="••••••" onkeydown="if(event.key==='Enter') executeAuth()">
            <button class="btn-apply" onclick="executeAuth()" style="width:100%; padding: 18px;">Enter Unified Dashboard</button>
        </div>
    </div>

    <div class="admin-nav" id="admin-nav">
        <div class="logo">
            <i class="fas fa-rocket" style="color:var(--admin-primary)"></i>
            <span style="font-weight:800; font-family:'Space Grotesk'; font-size:1.4rem;">V5 Dashboard</span>
        </div>
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('visual')"><i class="fas fa-magic"></i> Home (Visual)</button>
            <button class="tab-btn" onclick="switchTab('services')"><i class="fas fa-briefcase"></i> Services</button>
            <button class="tab-btn" onclick="switchTab('pricing')"><i class="fas fa-tags"></i> Pricing</button>
        </div>
    </div>

    <!-- PANEL: VISUAL DESIGN -->
    <div id="panel-visual" class="panel active">
        <div id="designer-canvas"></div>
        
        <div id="studio-toolbox">
            <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                <b style="color:var(--admin-primary); text-transform:uppercase; font-size:0.8rem;">Visual Studio Tools</b>
                <i class="fas fa-times" onclick="closeToolbox()" style="cursor:pointer"></i>
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Custom Color</label>
                <input type="color" id="tool-color" oninput="applyPulse('color')" style="width:100%; height:40px; border:none; background:none; cursor:pointer;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Font Size (px)</label>
                <input type="range" id="tool-size" min="10" max="150" oninput="applyPulse('fontSize')" style="width:100%; accent-color:var(--admin-primary)">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Height / Space (px)</label>
                <input type="range" id="tool-padding" min="0" max="300" oninput="applyPulse('padding')" style="width:100%; accent-color:var(--admin-primary)">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--admin-gray)">Corner Radius (px)</label>
                <input type="range" id="tool-radius" min="0" max="150" oninput="applyPulse('borderRadius')" style="width:100%; accent-color:var(--admin-primary)">
            </div>
        </div>

        <div style="position:fixed; bottom:40px; left:50%; transform:translateX(-50%); z-index:2500;">
             <button class="btn-apply" id="saveBtn" onclick="saveV5Mirror()">Apply Total Visual Mirror ✅</button>
        </div>
    </div>

    <!-- PANEL: SERVICES -->
    <div id="panel-services" class="panel">
        <div class="form-container" style="max-width:800px;">
            <div class="form-card">
                <h3 style="margin-top:0; color:var(--admin-primary);">Add/Edit Services (Profito)</h3>
                <div class="form-group"><label>Service Title</label><input type="text" id="serviceTitle"></div>
                <div class="form-group"><label>Icon (Emoji/FA)</label><input type="text" id="serviceIcon"></div>
                <div class="form-group"><label>Description</label><textarea id="serviceDesc"></textarea></div>
                <button class="btn-apply" style="width:100%;" onclick="alert('Services Syncing...')">Update Service Card</button>
            </div>
        </div>
    </div>

    <!-- PANEL: PRICING -->
    <div id="panel-pricing" class="panel">
        <div class="form-container" style="max-width:800px;">
            <div class="form-card">
                <h3 style="margin-top:0; color:var(--admin-primary);">Manage Pricing Packages</h3>
                <div class="form-group"><label>Package Name</label><input type="text" id="priceName"></div>
                <div class="form-group"><label>Price Range</label><input type="text" id="priceRange"></div>
                <div class="form-group"><label>Features (Comma Separated)</label><textarea id="priceFeatures"></textarea></div>
                <button class="btn-apply" style="width:100%;" onclick="alert('Pricing Syncing...')">Update Pricing Plan</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = "https://imuqwquuytcfuqbpaqoa.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdXF3cXV1eXRjZnVxYnBhcW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTQwNzcsImV4cCI6MjA5MTAzMDA3N30.J_E1pbC8nJKMsIMJE-IAnI_3lV47q6WX0HuSSWIhpd4";
        let _supabase = null;
        let activeEl = null;

        function switchTab(t) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + t).classList.add('active');
            event.target.classList.add('active');
        }

        async function executeAuth() {
            if (document.getElementById('masterKey').value === 'mumin69') {
                document.getElementById('login-gate').style.display = 'none';
                document.getElementById('admin-nav').style.display = 'flex';
                _supabase = window.supabase.createClient(SB_URL, SB_KEY);
                startHydrationPulse();
            } else { alert("Key Denied."); }
        }

        async function startHydrationPulse() {
            try {
                const res = await fetch('index.html');
                let html = await res.text();
                
                // PERFORMANCE CLEANUP
                html = html.replace(/createParticles\(\);/g, "// Disabled");
                html = html.replace(/<canvas[^>]*><\/canvas>/g, "");
                
                const canvas = document.getElementById('designer-canvas');
                canvas.innerHTML = html; // Full index.html fetch

                // SYNC STYLES
                const styles = Array.from(document.getElementById('designer-canvas').querySelectorAll('style, link[rel="stylesheet"]'));
                styles.forEach(s => document.head.appendChild(s.cloneNode(true)));

                canvas.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    openStudio(e.target);
                });

                console.log("Total Restoration Complete.");
            } catch (err) { console.error(err); }
        }

        function openStudio(el) {
            activeEl = el;
            document.getElementById('studio-toolbox').style.display = 'block';
            document.querySelectorAll('.editing-now').forEach(n => n.classList.remove('editing-now'));
            el.classList.add('editing-now');
        }

        function applyPulse(type) {
            if (!activeEl) return;
            const val = document.getElementById('tool-' + (type==='borderRadius'?'radius':type)).value;
            if (type === 'color') activeEl.style.setProperty('color', val, 'important');
            else if (type === 'fontSize' || type === 'padding' || type === 'borderRadius') activeEl.style[type] = val + 'px';
        }

        function saveV5Mirror() {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mirroring Full Site...';
            setTimeout(() => {
                btn.style.background = "#00c853";
                btn.innerText = "Site Mirror Active!";
                setTimeout(() => {
                    btn.style.background = "";
                    btn.innerText = "Apply Total Visual Mirror ✅";
                }, 3000);
            }, 1500);
        }

        function closeToolbox() {
            if (activeEl) activeEl.classList.remove('editing-now');
            document.getElementById('studio-toolbox').style.display = 'none';
        }
    </script>
</body>
</html>
