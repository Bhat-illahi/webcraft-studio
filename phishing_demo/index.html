<!DOCTYPE html>
<html>
<head>
    <title>Login to Continue</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #1877f2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #166fe5; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="color: #1877f2;">Free Wi-Fi Login</h2>
        <p>Please log in with your social account to access the internet.</p>
        <!-- This form will just refresh the page for now, but in reality, it would send data to a Python server -->
        <form action="/" method="GET" onsubmit="alert('Hacked! Username: ' + document.getElementById('user').value + '\nPassword: ' + document.getElementById('pass').value); return false;">
            <input type="text" id="user" placeholder="Email or Phone Number" required>
            <input type="password" id="pass" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
