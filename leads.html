<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads Access | WebCraft Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary: #6C63FF;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --border: rgba(255, 255, 255, 0.1);
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    #auth-gate {
      background: var(--surface);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--primary);
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      margin-top: 10vh;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 20px 0;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      text-align: center;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    #leads-panel {
      display: none;
      width: 100%;
      max-width: 1200px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      background: var(--surface);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid var(--border);
    }

    .leads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .lead-card {
      background: var(--surface);
      padding: 25px;
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: 0.3s;
      position: relative;
    }

    .lead-card.contacted {
      opacity: 0.6;
      border-color: var(--success);
    }

    .lead-card.contacted h3 {
      text-decoration: line-through;
      color: var(--success);
    }

    .lead-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .wa-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .action-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: 0.2s;
    }

    .tick-btn { color: var(--success); background: rgba(34, 197, 94, 0.1); }
    .del-btn { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    .action-icon:hover { transform: scale(1.1); }

    .add-btn {
      background: var(--primary);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

  <div id="auth-gate">
    <i class="fas fa-lock" style="font-size: 40px; color: var(--primary); margin-bottom: 20px;"></i>
    <h2>Owner Access</h2>
    <input type="password" id="pass" placeholder="Enter Secret Key">
    <button class="btn" onclick="checkPass()">Unlock Data</button>
  </div>

  <div id="leads-panel">
    <div class="header">
      <div>
        <h1><i class="fas fa-chart-line"></i> Kashmir Leads</h1>
        <p style="opacity:0.6; font-size: 0.8rem;">Click the checkmark when you've sent the message.</p>
      </div>
      <button class="add-btn" onclick="addNewLead()"><i class="fas fa-plus"></i> Add New</button>
    </div>
    <div class="leads-grid" id="leadsGrid"></div>
  </div>

  <script>
    const INITIAL_LEADS = [
      { id: 1, name: "Fox The Luxury Salon", city: "Srinagar", phone: "9541116661", niche: "Luxury Salon", status: "new" },
      { id: 2, name: "ibaadat the jewellers", city: "Srinagar", phone: "9070057777", niche: "Boutique Jeweler", status: "new" },
      { id: 3, name: "Food Routes", city: "Srinagar", phone: "9906780707", niche: "Multi-cuisine Restaurant", status: "new" },
      { id: 4, name: "Gold Souk", city: "Srinagar", phone: "01942486494", niche: "Jewellery Store", status: "new" },
      { id: 5, name: "BLACK UNISEX SALON", city: "Sopore", phone: "7780871292", niche: "High-end Salon", status: "new" },
      { id: 6, name: "Zeavar Mahal", city: "Anantnag", phone: "9797051684", niche: "Jewellery Store", status: "new" }
    ];

    function checkPass() {
      if (document.getElementById('pass').value === '0000') {
        document.getElementById('auth-gate').style.display = 'none';
        document.getElementById('leads-panel').style.display = 'block';
        initLeads();
      } else { alert("Wrong Key"); }
    }

    function initLeads() {
      if (!localStorage.getItem('webcraft_leads_v2')) {
        localStorage.setItem('webcraft_leads_v2', JSON.stringify(INITIAL_LEADS));
      }
      renderLeads();
    }

    function renderLeads() {
      const leads = JSON.parse(localStorage.getItem('webcraft_leads_v2') || '[]');
      const grid = document.getElementById('leadsGrid');
      
      grid.innerHTML = leads.map(l => `
        <div class="lead-card ${l.status === 'contacted' ? 'contacted' : ''}">
          <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span style="font-size:0.7rem; color:var(--primary); font-weight:800;">${l.city.toUpperCase()}</span>
            ${l.status === 'contacted' ? '<i class="fas fa-check-circle" style="color:var(--success)"></i>' : ''}
          </div>
          <h3>${l.name}</h3>
          <p style="font-size:0.8rem; opacity:0.6; margin: 5px 0 15px;">Target: ${l.niche}</p>
          
          <div class="lead-actions">
            <a href="https://wa.me/${l.phone.replace(/\D/g, '')}?text=${encodeURIComponent("Hi " + l.name + "! I'm from WebCraft Studio. I saw your business in " + l.city + " and would love to build a premium website for you. Interested?")}" 
               target="_blank" class="wa-btn" onclick="markContacted(${l.id})">
              <i class="fab fa-whatsapp"></i> Pitch
            </a>
            <div class="action-icon tick-btn" onclick="toggleStatus(${l.id})" title="Mark as contacted">
              <i class="fas fa-check"></i>
            </div>
            <div class="action-icon del-btn" onclick="deleteLead(${l.id})" title="Delete lead">
              <i class="fas fa-trash"></i>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleStatus(id) {
      let leads = JSON.parse(localStorage.getItem('webcraft_leads_v2'));
      leads = leads.map(l => l.id === id ? {...l, status: l.status === 'contacted' ? 'new' : 'contacted'} : l);
      localStorage.setItem('webcraft_leads_v2', JSON.stringify(leads));
      renderLeads();
    }

    function markContacted(id) {
      // Small delay to allow WA to open
      setTimeout(() => {
        let leads = JSON.parse(localStorage.getItem('webcraft_leads_v2'));
        leads = leads.map(l => l.id === id ? {...l, status: 'contacted'} : l);
        localStorage.setItem('webcraft_leads_v2', JSON.stringify(leads));
        renderLeads();
      }, 1000);
    }

    function deleteLead(id) {
      if (!confirm("Delete this lead permanently?")) return;
      let leads = JSON.parse(localStorage.getItem('webcraft_leads_v2'));
      leads = leads.filter(l => l.id !== id);
      localStorage.setItem('webcraft_leads_v2', JSON.stringify(leads));
      renderLeads();
    }

    function addNewLead() {
      const name = prompt("Business Name:");
      const city = prompt("City:");
      const phone = prompt("Phone:");
      const niche = prompt("Niche:");

      if (name && phone) {
        let leads = JSON.parse(localStorage.getItem('webcraft_leads_v2') || '[]');
        const newId = Date.now();
        leads.unshift({ id: newId, name, city, phone, niche, status: 'new' });
        localStorage.setItem('webcraft_leads_v2', JSON.stringify(leads));
        renderLeads();
      }
    }
  </script>
</body>
</html>
