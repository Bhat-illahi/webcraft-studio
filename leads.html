<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads Access | WebCraft Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary: #6C63FF;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --border: rgba(255, 255, 255, 0.1);
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    #auth-gate {
      background: var(--surface);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid var(--primary);
      text-align: center;
      width: 90%;
      max-width: 400px;
      margin-top: 10vh;
      display: block; /* Shown by default */
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 20px 0;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: var(--primary); }

    #leads-panel { display: none; width: 100%; max-width: 1200px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: var(--surface);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 15px;
    }

    .leads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .lead-card {
      background: var(--surface);
      padding: 25px;
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: 0.3s;
      position: relative;
    }

    /* Status Styles */
    .lead-card.interested { border-color: var(--success); box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
    .lead-card.not-interested { border-color: var(--danger); opacity: 0.7; }
    .lead-card.ignored { border-color: var(--muted); opacity: 0.4; }
    .lead-card.pitched { 
      border-color: var(--primary); 
      opacity: 0.4; 
      filter: grayscale(0.5);
      transition: opacity 0.3s, filter 0.3s;
    }
    .lead-card.pitched:hover {
      opacity: 0.8;
      filter: grayscale(0);
    }

    .status-pill {
      font-size: 0.65rem;
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: 800;
      text-transform: uppercase;
      margin-left: 10px;
    }
    .status-new { background: rgba(108, 99, 255, 0.1); color: var(--primary); }
    .status-pitched { background: rgba(108, 99, 255, 0.2); color: #fff; }
    .status-interested { background: var(--success); color: #fff; }
    .status-not_interested { background: var(--danger); color: #fff; }
    .status-ignored { background: var(--muted); color: #fff; }

    .lead-actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }

    .wa-btn {
      flex: 1;
      min-width: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .action-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: 0.2s;
      font-size: 0.9rem;
    }

    .int-btn { color: var(--success); background: rgba(34, 197, 94, 0.1); }
    .pitched-btn { color: var(--primary); background: rgba(108, 99, 255, 0.1); }
    .not-int-btn { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .ign-btn { color: var(--muted); background: rgba(100, 116, 139, 0.1); }
    .del-btn { color: #fff; background: rgba(255, 255, 255, 0.1); margin-left: auto; }

    .action-icon:hover { transform: translateY(-3px); filter: brightness(1.2); }
    .action-icon.active { border-width: 2px; box-shadow: 0 0 10px currentColor; }

    .btn-group { display: flex; gap: 10px; }
    .add-btn { background: var(--primary); color: white; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .import-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; }
    .logout-btn { background: transparent; color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; }
    .logout-btn:hover { background: rgba(239, 68, 68, 0.1); }

    #cloud-status { font-size: 0.7rem; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 5px; }
    .syncing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
  </style>
</head>
<body>

  <div id="auth-gate">
    <i class="fas fa-fingerprint" style="font-size: 40px; color: var(--primary); margin-bottom: 20px;"></i>
    <h2 style="margin-bottom:10px;">Security Check</h2>
    <p style="font-size:0.8rem; color:var(--muted)">Unauthorized access is prohibited.</p>
    <input type="password" id="pass" placeholder="Enter Secret PIN" onkeydown="if(event.key==='Enter') checkPass()">
    <button class="add-btn" style="width:100%" onclick="checkPass()">Unlock Session</button>
  </div>

  <div id="leads-panel">
    <div class="header">
      <div>
        <h1><i class="fas fa-server"></i> Cloud Lead CRM</h1>
        <div id="cloud-status"><i class="fas fa-check-circle" style="color:var(--success)"></i> System Ready</div>
      </div>
      <div class="btn-group">
        <button class="import-btn" onclick="importLatestBatch()"><i class="fas fa-sync"></i> Pull Research</button>
        <button class="add-btn" onclick="addNewLead()"><i class="fas fa-plus"></i> Manual Add</button>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
    <div class="leads-grid" id="leadsGrid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SB_URL  = 'https://imuqwquuytcfuqbpaqoa.supabase.co';
    const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltdXF3cXV1eXRjZnVxYnBhcW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTQwNzcsImV4cCI6MjA5MTAzMDA3N30.J_E1pbC8nJKMsIMJE-IAnI_3lV47q6WX0HuSSWIhpd4';
    let sb = null;
    let leadsData = [];
    const MASTER_PIN = '582619';

    // RESEARCH BATCH (Latest discovered by AI)
    const RESEARCH_BATCH = [
      { id: Date.now()+1, name: "Jk hardware & ply sopore", city: "Sopore", phone: "09906624554", niche: "Hardware & Plywood", status: "new" },
      { id: Date.now()+2, name: "irshad hardware store", city: "Sopore", phone: "09797819684", niche: "Hardware Store", status: "new" },
      { id: Date.now()+3, name: "Nowpora Hardware", city: "Sopore", phone: "09149516126", niche: "Construction Supplies", status: "new" },
      { id: Date.now()+4, name: "Naseer & Son's", city: "Sopore", phone: "07780843902", niche: "Fruit Export Agent", status: "new" },
      { id: Date.now()+5, name: "Nadihal Fruit Company", city: "Sopore", phone: "07889570291", niche: "Fruit Export", status: "new" },
      { id: Date.now()+6, name: "Madina Fruit Traders", city: "Sopore", phone: "07006320178", niche: "Fruit Traders", status: "new" },
      { id: Date.now()+7, name: "Resonance Coaching", city: "Sopore", phone: "07006859495", niche: "Coaching Institute", status: "new" },
      { id: Date.now()+8, name: "Bodyworks Gym & Snooker", city: "Sopore", phone: "07780960236", niche: "Gym & Health Club", status: "new" },
      { id: Date.now()+9, name: "City Gym Centre Sopore", city: "Sopore", phone: "07006938022", niche: "Gym & Fitness", status: "new" },
      { id: Date.now()+10, name: "SOFI STORE SOPORE", city: "Sopore", phone: "09149548660", niche: "Clothing & Boutique", status: "new" }
    ];

    // ==== AUTH SYSTEM ====
    function checkPass() {
      if (document.getElementById('pass').value === MASTER_PIN) {
        localStorage.setItem('wc_leads_session', 'true');
        showDashboard();
      } else { 
        alert("Access Denied: Incorrect PIN"); 
      }
    }

    function logout() {
      localStorage.removeItem('wc_leads_session');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('auth-gate').style.display = 'none';
      document.getElementById('leads-panel').style.display = 'block';
      initSupabase();
    }

    // ==== INIT ====
    window.addEventListener('onload', () => {
      // Handled below by immediate check
    });

    // Immediate session check
    if (localStorage.getItem('wc_leads_session') === 'true') {
      showDashboard();
    }

    function initSupabase() {
      try {
        sb = window.supabase.createClient(SB_URL, SB_KEY);
        loadLeadsFromCloud();
      } catch(e) { console.error("Cloud init failed", e); }
    }

    async function loadLeadsFromCloud() {
      setSyncStatus('Connecting to Cloud...', 'warning');
      try {
        const { data, error } = await sb.from('site_settings').select('value').eq('key', 'crm_leads_data').single();
        
        let cloudLeads = [];
        if (data && data.value) {
          cloudLeads = JSON.parse(data.value);
        }

        // MIGRATION: If cloud is empty, check localStorage
        if (cloudLeads.length === 0) {
          const local = localStorage.getItem('webcraft_leads_v2') || localStorage.getItem('webcraft_leads_v3');
          if (local) {
            cloudLeads = JSON.parse(local);
            setSyncStatus('Migrating Local State...', 'warning');
          }
        }

        if (cloudLeads.length === 0) {
          leadsData = RESEARCH_BATCH;
        } else {
          leadsData = cloudLeads;
        }

        renderLeads();
        syncToCloud(); 
        setSyncStatus('Cloud Synchronized', 'success');
      } catch(e) {
        console.error("Cloud load error", e);
        setSyncStatus('Loading Local Backup...', 'warning');
        const local = localStorage.getItem('webcraft_leads_cloud_backup');
        if (local) leadsData = JSON.parse(local);
        renderLeads();
      }
    }

    async function syncToCloud() {
      setSyncStatus('Syncing...', 'warning');
      localStorage.setItem('webcraft_leads_cloud_backup', JSON.stringify(leadsData));
      try {
        await sb.from('site_settings').upsert({ 
          key: 'crm_leads_data', 
          value: JSON.stringify(leadsData) 
        });
        setSyncStatus('Cloud Synchronized', 'success');
      } catch(e) {
        setSyncStatus('Cloud Offset (Local Only)', 'danger');
      }
    }

    function importLatestBatch() {
      const existingNames = leadsData.map(l => l.name.toLowerCase());
      const newLeads = RESEARCH_BATCH.filter(l => !existingNames.includes(l.name.toLowerCase()));
      
      if (newLeads.length === 0) {
        alert("You already have the latest research batch!");
        return;
      }

      leadsData = [...newLeads, ...leadsData];
      renderLeads();
      syncToCloud();
      alert(`Imported ${newLeads.length} new high-intent leads from Sopore/Kashmir!`);
    }

    function setSyncStatus(msg, type) {
      const status = document.getElementById('cloud-status');
      let icon = '<i class="fas fa-check-circle"></i>';
      let color = 'var(--success)';
      if (type === 'warning') { icon = '<div class="syncing-dot"></div>'; color = 'var(--warning)'; }
      if (type === 'danger') { icon = '<i class="fas fa-exclamation-triangle"></i>'; color = 'var(--danger)'; }
      status.innerHTML = `${icon} ${msg}`;
      status.style.color = color;
    }

    function renderLeads() {
      const grid = document.getElementById('leadsGrid');
      grid.innerHTML = leadsData.map(l => `
        <div class="lead-card ${l.status.replace('_', '-')}">
          <div style="display:flex; align-items:center; margin-bottom:10px;">
            <span style="font-size:0.65rem; color:var(--primary); font-weight:900; letter-spacing:1px;">${l.city.toUpperCase()}</span>
            <span class="status-pill status-${l.status}">${l.status.replace('_', ' ')}</span>
          </div>
          <h3 style="font-size:1.1rem;">${l.name}</h3>
          <p style="font-size:0.8rem; opacity:0.5; margin: 4px 0 15px;">Target: ${l.niche}</p>
          
          <div class="lead-actions">
            <a href="https://wa.me/${l.phone.replace(/\D/g, '')}?text=${encodeURIComponent("Hi " + l.name + "! I'm from WebCraft Studio. I saw your shop in " + l.city + " and would love to build a premium website for you.")}" 
               target="_blank" class="wa-btn" onclick="updateStatus(${l.id}, 'pitched')">
              <i class="fab fa-whatsapp"></i> Send Pitch
            </a>
            <div class="action-icon pitched-btn ${l.status==='pitched'?'active':''}" onclick="updateStatus(${l.id}, 'pitched')" title="Message Sent">
              <i class="fas fa-paper-plane"></i>
            </div>
            <div class="action-icon int-btn ${l.status==='interested'?'active':''}" onclick="updateStatus(${l.id}, 'interested')" title="Interested">
              <i class="fas fa-thumbs-up"></i>
            </div>
            <div class="action-icon not-int-btn ${l.status==='not_interested'?'active':''}" onclick="updateStatus(${l.id}, 'not_interested')" title="Not Interested">
              <i class="fas fa-thumbs-down"></i>
            </div>
            <div class="action-icon ign-btn ${l.status==='ignored'?'active':''}" onclick="updateStatus(${l.id}, 'ignored')" title="Ignored">
              <i class="fas fa-eye-slash"></i>
            </div>
            <div class="action-icon del-btn" onclick="deleteLead(${l.id})" title="Delete">
              <i class="fas fa-trash-alt"></i>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateStatus(id, newStatus) {
      leadsData = leadsData.map(l => l.id === id ? {...l, status: newStatus} : l);
      renderLeads();
      syncToCloud();
    }

    function deleteLead(id) {
      if (!confirm("Delete lead?")) return;
      leadsData = leadsData.filter(l => l.id !== id);
      renderLeads();
      syncToCloud();
    }

    function addNewLead() {
      const name = prompt("Name:");
      const city = prompt("City:");
      const phone = prompt("Phone:");
      const niche = prompt("Niche:");
      if (name && phone) {
        leadsData.unshift({ id: Date.now(), name, city, phone, niche, status: 'new' });
        renderLeads();
        syncToCloud();
      }
    }
  </script>
</body>
</html>
